<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#141e38"/>
      <stop offset="100%" stop-color="#1e2b4d"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lwcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="256" height="256" rx="52" fill="url(#bgGrad)"/>
  <rect width="252" height="252" x="2" y="2" rx="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Subtle grid lines representing UML / Virtual hierarchy -->
  <path d="M 64 80 L 192 80 M 64 128 L 192 128 M 64 176 L 192 176" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <path d="M 80 64 L 80 192 M 128 64 L 128 192 M 176 64 L 176 192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- Salesforce Cloud symbol in top-right -->
  <g transform="translate(142, 38) scale(0.65)" filter="url(#glow)">
    <path d="M 38 46 A 20 20 0 0 1 74 34 A 28 28 0 0 1 122 36 A 22 22 0 0 1 146 54 A 18 18 0 0 1 138 88 L 36 88 A 22 22 0 0 1 38 46 Z" fill="url(#cloudGrad)"/>
  </g>

  <!-- Connection Graph Lines (UML / Virtual Folders hierarchy) -->
  <path d="M 88 124 L 88 160 Q 88 174 102 174 L 140 174" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <path d="M 124 102 L 150 102 Q 164 102 164 116 L 164 140" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Apex Folder (Yellow/Gold) -->
  <g transform="translate(42, 78)">
    <!-- Back Tab -->
    <path d="M 6 0 L 34 0 Q 38 0 41 4 L 48 12 L 86 12 Q 92 12 92 18 L 92 26 L 6 26 Z" fill="#b45309"/>
    <!-- Folder Body -->
    <rect x="6" y="16" width="90" height="60" rx="8" fill="url(#apexGrad)"/>
    <!-- Apex Code Symbol </> -->
    <text x="51" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="22" font-weight="900" fill="#78350f" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- LWC Folder (Green) -->
  <g transform="translate(122, 126)">
    <!-- Back Tab -->
    <path d="M 6 0 L 32 0 Q 36 0 39 4 L 46 12 L 82 12 Q 88 12 88 18 L 88 26 L 6 26 Z" fill="#15803d"/>
    <!-- Folder Body -->
    <rect x="6" y="16" width="86" height="58" rx="8" fill="url(#lwcGrad)"/>
    <!-- Lightning Bolt / Web component symbol -->
    <path d="M 50 26 L 38 45 L 48 45 L 44 65 L 60 43 L 49 43 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Hierarchy Dots / Ports -->
  <circle cx="88" cy="124" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <circle cx="140" cy="174" r="5" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
  <circle cx="164" cy="140" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
</svg>

